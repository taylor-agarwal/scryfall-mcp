[project]
name = "scryfall-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taylor Agarwal", email = "taylor.agarwal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
    "scrython>=3.1.0",
]

[project.scripts]
scryfall-mcp = "scryfall_mcp:main"

[project.optional-dependencies]
examples = [
    "deepagents>=0.7.34",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain[mcp]>=1.4.9",
    "openai>=3.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
